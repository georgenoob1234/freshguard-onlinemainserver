services:
  onlinemainserver:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - oms_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  oms_data:
