<!doctype html>
<html lang="{{ html_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} — {{ t('app_title') }}</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-card__header">
      <div class="login-card__brand">
        <span class="login-card__logo">OMS</span>
      </div>
      <h1 class="login-card__title">{{ t('login_heading') }}</h1>
      <p class="login-card__subtitle" id="oms-bootstrap-subtitle">{{ bootstrap_loading_message }}</p>
    </div>
    <div class="form-actions" id="oms-fallback-login-wrap" style="display: none; border-top: 1px solid var(--color-border); margin-top: 1rem; padding-top: 1rem;">
      <a href="/admin/login" class="btn btn--secondary btn--lg" style="width: 100%;">
        {{ t('button_go_to_admin_login') }}
      </a>
    </div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const OMS_WEBAPP_TOKEN_KEY = "__OMS_ADMIN_WEBAPP_TOKEN";
    const GENERIC_LOGIN_ERROR = {{ login_error_message | tojson }};
    const PAGE_T0 = Date.now();
    const FALLBACK_BUTTON_MS = 3000;

    let fallbackShown = false;

    function setSubtitle(message) {
      const el = document.getElementById("oms-bootstrap-subtitle");
      if (el && message) {
        el.textContent = message;
      }
    }

    function revealFallbackLogin(message) {
      const show = () => {
        if (fallbackShown) return;
        fallbackShown = true;
        const wrap = document.getElementById("oms-fallback-login-wrap");
        if (wrap) {
          wrap.style.display = "flex";
        }
        if (message) {
          setSubtitle(message);
        }
      };

      const wait = Math.max(0, FALLBACK_BUTTON_MS - (Date.now() - PAGE_T0));
      setTimeout(show, wait);
    }

    function setOmsWebAppToken(token) {
      if (!token) {
        return;
      }
      window[OMS_WEBAPP_TOKEN_KEY] = token;
      try {
        window.name = JSON.stringify({ oms_admin_webapp_token: token });
      } catch (_error) {
        // Ignore serialization failures and keep in-memory copy only.
      }
    }

    async function loadAdminWithToken(path, token) {
      const response = await fetch(path, {
        method: "GET",
        headers: { Authorization: `Bearer ${token}` },
        credentials: "same-origin",
      });
      const html = await response.text();
      const responseUrl = response.url || path;
      const nextUrl = new URL(responseUrl, window.location.origin);
      history.replaceState({}, "", `${nextUrl.pathname}${nextUrl.search}`);
      document.open();
      document.write(html);
      document.close();
    }

    function readInitData() {
      return (window.Telegram?.WebApp?.initData || "").trim();
    }

    async function waitForInitData(maxWaitMs) {
      window.Telegram?.WebApp?.ready?.();
      const deadline = Date.now() + maxWaitMs;
      let data = readInitData();
      while (!data && Date.now() < deadline) {
        await new Promise((r) => setTimeout(r, 100));
        data = readInitData();
      }
      return data;
    }

    async function bootstrapTelegramWebAppLogin() {
      const initData = await waitForInitData(2500);
      if (!initData) {
        revealFallbackLogin();
        return;
      }

      try {
        const response = await fetch("/admin/auth/telegram/miniapp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ init_data: initData })
        });

        if (!response.ok) {
          revealFallbackLogin(GENERIC_LOGIN_ERROR);
          return;
        }

        const payload = await response.json();
        const token = typeof payload.webapp_token === "string" ? payload.webapp_token.trim() : "";
        if (!token) {
          revealFallbackLogin(GENERIC_LOGIN_ERROR);
          return;
        }

        setOmsWebAppToken(token);
        const redirectPath = typeof payload.redirect === "string" && payload.redirect ? payload.redirect : "/admin";
        await loadAdminWithToken(redirectPath, token);
      } catch (_error) {
        revealFallbackLogin(GENERIC_LOGIN_ERROR);
      }
    }

    setTimeout(() => {
      revealFallbackLogin();
    }, FALLBACK_BUTTON_MS);

    bootstrapTelegramWebAppLogin();
  </script>
</body>
</html>
