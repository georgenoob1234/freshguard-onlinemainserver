<!doctype html>
<html lang="{{ html_lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} — {{ t('app_title') }}</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-card__header">
      <div class="login-card__brand">
        <span class="login-card__logo">OMS</span>
      </div>
      <h1 class="login-card__title">{{ t('login_heading') }}</h1>
      <p class="login-card__subtitle">{{ t('app_title') }}</p>
    </div>

    {% if error %}
    <div class="flash flash--error mb-4" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" x2="9" y1="9" y2="15"/><line x1="9" x2="15" y1="9" y2="15"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/admin/login">
      <div class="form-group">
        <label class="form-label" for="username">{{ t('label_username') }}</label>
        <input class="form-input" type="text" id="username" name="username" value="{{ username or '' }}" autocomplete="username" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">{{ t('label_password') }}</label>
        <input class="form-input" type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <div class="form-actions" style="border-top: none; margin-top: 1.5rem; padding-top: 0;">
        <button type="submit" class="btn btn--primary btn--lg" style="width: 100%;">{{ t('button_sign_in') }}</button>
      </div>
    </form>

    <div class="form-actions" style="border-top: 1px solid var(--color-border); margin-top: 1rem; padding-top: 1rem;">
      <button
        type="button"
        class="btn btn--secondary btn--lg"
        style="width: 100%;"
        id="telegram-login-btn"
      >
        {{ t('button_login_via_telegram') }}
      </button>
      <p class="form-label__hint" style="margin-top: 0.5rem; text-align: center;" id="telegram-login-hint">
        {{ t('hint_login_via_telegram') }}
      </p>
    </div>

    <div class="login-card__footer">
      <span>{{ t('switch_language') }}:</span>
      {% if locale == 'ru' %}
        <a href="/admin/set-language?lang=en&next=/admin/login">English</a>
      {% else %}
        <a href="/admin/set-language?lang=ru&next=/admin/login">Русский</a>
      {% endif %}
    </div>
  </div>
  <script>
    async function startTelegramLogin() {
      const btn = document.getElementById('telegram-login-btn');
      const hint = document.getElementById('telegram-login-hint');
      btn.disabled = true;
      hint.textContent = '{{ t('hint_telegram_opening') }}';
      try {
        const response = await fetch('/admin/auth/telegram/challenge/start', { method: 'POST' });
        if (!response.ok) {
          hint.textContent = '{{ t('error_telegram_login_failed') }}';
          btn.disabled = false;
          return;
        }
        const payload = await response.json();
        window.location.href = payload.deep_link;
      } catch (_error) {
        hint.textContent = '{{ t('error_telegram_login_failed') }}';
        btn.disabled = false;
      }
    }
    document.getElementById('telegram-login-btn').addEventListener('click', startTelegramLogin);
  </script>
</body>
</html>
